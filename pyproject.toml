[project]
name = "nova"
version = "0.1.0"
description = "Nova, a gentle desktop coworker built on LangGraph."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph",
    "langchain-ollama",
]

[project.scripts]
nova = "nova.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
